[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "b2b-agent-skills"
dynamic = ["version"]
description = "Open-source AI tool for early-stage B2B founders across sales, marketing, GTM and RevOps. Point it at your notes, leads and CRM: it sharpens your message, finds your ICP, scores who to call, debriefs every deal, and reviews your pipeline. Runs on Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "pratsy" }]
keywords = ["llm", "ai-agents", "claude", "mcp", "sales", "revops", "gtm", "meddpicc", "b2b"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.26.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6.0"]
openai = ["openai>=3.46.0"]
mcp = ["mcp>=2.3.0"]
server = ["fastapi>=0.162.1", "uvicorn>=0.54.0"]
dotenv = ["python-dotenv>=1.2.4"]
docs-reader = ["pypdf>=7.0.0"]
all = ["b2b-agent-skills[anthropic,openai,mcp,server,dotenv,docs-reader]"]
dev = [
  "b2b-agent-skills[all]",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "ruff>=0.17.4",
  "mypy>=2.4.1",
  "pre-commit>=4.6.2",
  "build>=1.6.1",
  "pillow>=12.3.0",
]
docs = ["mkdocs-material>=9.7.7"]

[project.scripts]
b2b-skills = "b2b_agent_skills.cli:main"

[project.urls]
Homepage = "https://github.com/pratsy/B2B_agent_skills"
Documentation = "https://pratsy.github.io/B2B_agent_skills/"
Repository = "https://github.com/pratsy/B2B_agent_skills"
Issues = "https://github.com/pratsy/B2B_agent_skills/issues"
Changelog = "https://github.com/pratsy/B2B_agent_skills/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "b2b_agent_skills/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["b2b_agent_skills"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "b2b_agent_skills/_skills"
"evals/golden" = "b2b_agent_skills/_evals"
"evals/playbooks" = "b2b_agent_skills/_evals_playbooks"
"playbooks" = "b2b_agent_skills/_playbooks"

[tool.hatch.build.targets.sdist]
include = [
  "b2b_agent_skills",
  ".claude/skills",
  "evals/golden",
  "evals/playbooks",
  "playbooks",
  "b2b-agent-skills-*",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"b2b_agent_skills/server.py" = ["B008"]  # FastAPI Depends() idiom

[tool.mypy]
python_version = "3.10"
packages = ["b2b_agent_skills"]
ignore_missing_imports = true
warn_unused_ignores = true
