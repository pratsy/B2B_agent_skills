[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "b2b-agent-skills"
dynamic = ["version"]
description = "Open-source GTM workspace for early-stage B2B teams (sales, marketing, RevOps): messaging, ICP discovery, lead scoring, call debriefs, and pipeline reviews on 46 evidence-grounded skills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "pratsy" }]
keywords = ["llm", "ai-agents", "claude", "mcp", "sales", "revops", "gtm", "meddpicc", "b2b"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=1.40"]
mcp = ["mcp>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dotenv = ["python-dotenv>=1.0"]
all = ["b2b-agent-skills[anthropic,openai,mcp,server,dotenv]"]
dev = [
  "b2b-agent-skills[all]",
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
  "pillow>=10",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
b2b-skills = "b2b_agent_skills.cli:main"

[project.urls]
Homepage = "https://github.com/pratsy/skills-AI"
Documentation = "https://pratsy.github.io/skills-AI/"
Repository = "https://github.com/pratsy/skills-AI"
Issues = "https://github.com/pratsy/skills-AI/issues"
Changelog = "https://github.com/pratsy/skills-AI/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "b2b_agent_skills/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["b2b_agent_skills"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "b2b_agent_skills/_skills"
"evals/golden" = "b2b_agent_skills/_evals"
"evals/playbooks" = "b2b_agent_skills/_evals_playbooks"
"playbooks" = "b2b_agent_skills/_playbooks"

[tool.hatch.build.targets.sdist]
include = [
  "b2b_agent_skills",
  ".claude/skills",
  "evals/golden",
  "evals/playbooks",
  "playbooks",
  "b2b-agent-skills-*",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"b2b_agent_skills/server.py" = ["B008"]  # FastAPI Depends() idiom

[tool.mypy]
python_version = "3.10"
packages = ["b2b_agent_skills"]
ignore_missing_imports = true
warn_unused_ignores = true
